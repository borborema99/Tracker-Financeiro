# Configuração do Netlify (ADR 013). Passo a passo em docs/deploy-netlify.md.

[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# A API inteira é a função `api` (netlify/functions/api.mjs), que declara `path: '/api/*'` no próprio código. A SPA
# lista as rotas dela em vez de um `/*` genérico: assim /api nunca é engolido pelo index.html, qualquer que seja a
# ordem em que o Netlify avalia função e redirecionamento, e um caminho desconhecido recebe 404 de verdade.
[[redirects]]
  from = "/entrar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/criar-conta"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacidade"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/termos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# Cabeçalhos dos arquivos estáticos. A CSP precisa ser idêntica à de servidor/seguranca/cabecalhos.js (que protege a
# API e o servidor local): tests/netlify-config.test.js confere. Sem 'unsafe-inline': o front não tem <style> nem
# style="" no HTML.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=15552000"

# Arquivos com hash no nome nunca mudam; o resto é sempre revalidado (o service worker também).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"
